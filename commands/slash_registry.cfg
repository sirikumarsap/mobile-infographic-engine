# FLOW MODE 1: Stateful Folder Preparation Commands
/restrict        - Usage: /restrict {"Alert", "Attention", "Stop"}
				   Dynamically updates forbidden words array inside system_state.json. JSON schema format.
				   
/upload-ref      - Uploads and stores layout/style guide images/attachments to the persistent reference folder.
/upload-asset    - Uploads and stores layout graphics, data charts, or tables to the assets folder.

# FLOW MODE 2 & 3: Unified Execution Command
/infographic     - Usage: /infographic "<prompt>"
		           Generates 9:16 mobile canvas blueprint validating against latest system_state.json.